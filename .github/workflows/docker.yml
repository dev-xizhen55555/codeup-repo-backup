name: Validate and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Build image without credentials
        run: docker build --tag codeup-backup:validation .
      - name: Verify runtime files
        run: |
          docker run --rm --entrypoint python codeup-backup:validation -c '
          import ast
          from pathlib import Path
          root = Path("/app")
          allowed = {"requirements.txt", "unified_backup.py", "config.py", "codeup_client.py", "gitlab_client.py", "gitee_client.py", "atomgit_client.py", "git_sync.py", "state_store.py", "s3_config_loader.py", "scheduler.py", "web_server.py"}
          actual = {item.name for item in root.iterdir()}
          assert actual == allowed, f"Unexpected runtime files: {actual ^ allowed}"
          for item in root.glob("*.py"):
              ast.parse(item.read_text(), filename=str(item))
          import requests, boto3
          from apscheduler.schedulers.blocking import BlockingScheduler
          print("Runtime files and dependencies verified")
          '

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dev-xizhen55555/codeup-repo-backup:latest
            ghcr.io/dev-xizhen55555/codeup-repo-backup:v2.0
            ghcr.io/dev-xizhen55555/codeup-repo-backup:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
