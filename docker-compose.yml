services:
  # 顺序备份到 GitLab, Gitee, AtomGit(固定私有, Token 仅在 OSS 配置中, 为空则跳过)
  backup:
    image: ghcr.io/dev-xizhen55555/codeup-repo-backup:v2.0
    container_name: codeup-backup
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # S3/OSS 配置（必需）
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-us-east-1}

      # 配置文件位置
      - ENV_FILE_KEY=${ENV_FILE_KEY:-codeupbackup.env}

      # 定时调度（不设置则默认每天12点）
      - BACKUP_CRON=${BACKUP_CRON:-}

      # 批处理配置
      - BATCH_SIZE=${BATCH_SIZE:-10}
      - CONCURRENCY=${CONCURRENCY:-3}
    command: python3 unified_backup.py
    restart: unless-stopped
